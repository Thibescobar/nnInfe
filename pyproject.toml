[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nninfe"
version = "0.1.0"
description = "Standalone 3D medical object detection inference pipeline using nnDetection ONNX models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Thibault Escobar"},
]
keywords = ["onnx", "medical-imaging", "3d-detection", "nndetection", "tensorrt", "ct-scan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "SimpleITK",
]

[project.scripts]
nninfe-det = "nninfe.infer_detection:main"
nninfe-seg = "nninfe.infer_segmentation:main"

[project.optional-dependencies]
cpu = ["onnxruntime"]
openvino = ["onnxruntime-openvino", "numpy<2"]
# GPU (cuda + trt) — unified CUDA 12 stack, same on Linux and Windows.
# tensorrt-cu12 is capped < 11 because onnxruntime-gpu links TensorRT 10 (nvinfer 10);
# a TensorRT 11 wheel would fail to load and the TensorRT EP would silently fall back to
# CPU. Bump this cap only together with an onnxruntime-gpu build compiled against TRT 11.
gpu = [
    "onnxruntime-gpu>=1.21",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cudnn-cu12",
    "tensorrt-cu12<11",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["nninfe*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["nninfe/tools/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Long lines tolerated in verbose print statements

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nninfe --cov-report=term-missing"

[tool.coverage.run]
omit = ["nninfe/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
