[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nndet-onnx"
version = "0.1.0"
description = "Standalone 3D medical object detection inference pipeline using nnDetection ONNX models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Thibault Escobar"},
]
keywords = ["onnx", "medical-imaging", "3d-detection", "nndetection", "tensorrt", "ct-scan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "SimpleITK",
]

[project.scripts]
nndet-infer = "nndet_onnx.nndet_onnx_inference_sw:main"

[project.optional-dependencies]
cpu = ["onnxruntime"]
openvino = ["onnxruntime-openvino", "numpy<2"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["nndet_onnx*"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["nndet_onnx/tools/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Long lines tolerated in verbose print statements

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nndet_onnx --cov-report=term-missing"

[tool.coverage.run]
omit = ["nndet_onnx/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
